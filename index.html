    :root { --bg: #e9eef2; --fg: #14202b; --pn: #fff; --bd: #b7c3cd; --ac: #b8862b; color-scheme: light; }
    @media (prefers-color-scheme: dark) {

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif;

    .menu-body { position: relative; z-index: 1; width: 100%; max-width: 520px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

    .stack { display: flex; flex-direction: column; align-items: stretch; gap: 12px; width: min(100%, 300px); }

    a.big:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
